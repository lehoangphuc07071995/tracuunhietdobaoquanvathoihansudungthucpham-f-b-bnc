er daily so the rice does not turn sour","쌀이 시지 않도록 매일 물을 교체하세요","चावल खट्टा न हो, इसके लिए रोज़ पानी बदलें"],"PL1-50":["Soak in clean water and change the water daily. Store in the fridge","깨끗한 물에 담그고 매일 물을 교체하세요. 냉장고에 보관하세요","साफ पानी में भिगोएँ और रोज़ पानी बदलें। फ्रिज में रखें"],"PL1-52":["Store in a cool, dry, well-ventilated place","서늘하고 건조하며 통풍이 잘 되는 곳에 보관하세요","ठंडी, सूखी, हवादार जगह पर रखें"],"PL1-56":["Follow the expiry date on the product packaging first","제품 포장에 기재된 유통기한을 먼저 따르세요","पहले उत्पाद पैकेजिंग पर लिखी समाप्ति तिथि का पालन करें"],"PL1-57":["Store refrigerated (do not reuse items set up at the buffet counter for sashimi)","냉장 보관(뷔페 카운터에 진열한 사시미는 재사용하지 마세요)","फ्रिज में रखें (बुफे काउंटर पर रखे सशिमी को पुनः उपयोग न करें)"],"PL1-65":["1/2 of the time stated on the packaging","포장에 기재된 시간의 1/2","पैकेजिंग पर लिखे समय का 1/2"],"PL1-66":["Store in the cooler. Follow the expiry date on the product packaging first","쿨러에 보관하세요. 제품 포장에 기재된 유통기한을 먼저 따르세요","कूलर में रखें। पहले उत्पाद पैकेजिंग पर लिखी समाप्ति तिथि का पालन करें"],"PL1-67":["Store in the cooler. Follow the expiry date on the product packaging first","쿨러에 보관하세요. 제품 포장에 기재된 유통기한을 먼저 따르세요","कूलर में रखें। पहले उत्पाद पैकेजिंग पर लिखी समाप्ति तिथि का पालन करें"],"PL1-68":["Store in a sealed container","밀폐 용기에 보관하세요","सीलबंद डिब्बे में रखें"],"PL1-69":["- Shelf life and storage conditions after opening follow the manufacturer recommendation first","- 개봉 후 유통기한과 보관 조건은 제조사 권장사항을 먼저 따릅니다","- खोलने के बाद शेल्फ लाइफ और भंडारण शर्तों के लिए पहले निर्माता की सिफारिश का पालन करें"],"PL2-01":["Record the preparation time, date and expiry date fully on the storage container and checklist.","조리 시간, 날짜, 유통기한을 보관 용기와 체크리스트에 빠짐없이 기록하세요.","तैयारी का समय, तिथि और समाप्ति तिथि भंडारण बर्तन और चेकलिस्ट पर पूरी तरह लिखें।"],"PL2-02":["Leftover after the shift (small quantity) should go into a storage container and into the fridge. Record the preparation date and expiry date fully on the storage container and checklist
