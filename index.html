은 현미...)","सूखे फल, अनाज और सूखे मेवे (सूखा संतरा, नींबू, सेब, स्ट्रॉबेरी, बादाम, अखरोट, ओट्स, भुना ब्राउन राइस...)"]},yv={"PL1-01":["Store in fridge (1-4°C) for 3-5 days --> make bread butter pudding","냉장고(1-4°C)에 3-5일 보관 --> 브레드 버터 푸딩으로 만들기","फ्रिज (1-4°C) में 3-5 दिन रखें --> ब्रेड बटर पुडिंग बनाएँ"],"PL1-02":["Do not reuse after serving on buffet","뷔페에 진열한 후 재사용 금지","बुफे पर परोसने के बाद पुनः उपयोग न करें"],"PL1-11":["- Keep in a sealed container","- 밀폐 용기에 보관","- सीलबंद डिब्बे में रखें"],"PL1-13":["- Follow the manufacturer recommendation if stated on the packaging.","- 포장에 기재된 경우 제조사 권장사항을 따르세요.","- पैकेजिंग पर लिखा हो तो निर्माता की सिफारिश का पालन करें।"],"PL1-14":["- Follow the manufacturer recommendation (if any).","- 제조사 권장사항(있는 경우)을 따르세요.","- निर्माता की सिफारिश (यदि कोई हो) का पालन करें।"],"PL1-15":["- When storing, wrap or close the lid tightly so moisture does not enter the product.","- 보관 시 수분이 제품에 들어가지 않도록 포장하거나 뚜껑을 단단히 닫으세요.","- भंडारण करते समय नमी उत्पाद में न जाए, इसलिए लपेटें या ढक्कन कसकर बंद करें।"],"PL1-21":["- Follow the manufacturer instructions on the packaging first.","- 먼저 포장에 기재된 제조사 지침을 따르세요.","- पहले पैकेजिंग पर निर्माता के निर्देशों का पालन करें।"],"PL1-36":["- Follow the manufacturer recommendation if stated on the packaging. Note: Transfer to other containers for storage; do not keep in the metal can.","- 포장에 기재된 경우 제조사 권장사항을 따르세요. 참고: 보관 시 다른 용기에 옮기세요. 금속 캔에 그대로 두지 마세요.","- पैकेजिंग पर लिखा हो तो निर्माता की सिफारिश का पालन करें। ध्यान दें: भंडारण के लिए अन्य बर्तनों में निकालें; धातु के डिब्बे में ही न रखें।"],"PL1-37":["- Cool down before placing in the freezer.","- 냉동실에 넣기 전에 식히세요.","- फ्रीजर में रखने से पहले ठंडा करें।"],"PL1-38":["- Cool down before cold storage. Divide into small portions for storage to ensure temperature.","- 냉장 보관 전에 식히세요. 온도를 확보하기 위해 소량씩 나누어 보관하세요.","- ठंडे भंडारण से पहले ठंडा करें। तापमान सुनिश्चित करने के लिए छोटे भागों में बाँटकर रखें।"],"PL1-44":["Or follow the manufacturer instructions / Store refrigerated","또는 제조사 지침을 따르세요 / 냉장 보관","या निर्माता के निर्देशों का पालन करें / फ्रिज में रखें"],"PL1-46":["For grilled items, use within the day only.","구운 제품은 당일에만 사용하세요.","ग्रिल किए आइटम केवल उसी दिन उपयोग करें।"],"PL1-47":["Follow the manufacturer instructions. If there is no recommendation, the limit to follow is 2 days / Store refrigerated","제조사 지침을 따르세요. 권장사항이 없으면 2일을 따릅니다 / 냉장 보관","निर्माता के निर्देशों का पालन करें। कोई सिफारिश न हो तो सीमा 2 दिन है / फ्रिज में रखें"],"PL1-48":["Change the water daily so the rice does not turn sour","쌀이 시지 않도록 매일 물을 교체하세요","चावल खट्टा न हो, इसके लिए रोज़ पानी बदलें"],"PL1-50":["Soak in clean water and change the water daily. Store in the fridge","깨끗한 물에 담그고 매일 물을 교체하세요. 냉장고에 보관하세요","साफ पानी में भिगोएँ और रोज़ पानी बदलें। फ्रिज में रखें"],"PL1-52":["Store in a cool, dry, well-ventilated place","서늘하고 건조하며 통풍이 잘 되는 곳에 보관하세요","ठंडी, सूखी, हवादार जगह पर रखें"],"PL1-56":["Follow the expiry date on the product packaging first","제품 포장에 기재된 유통기한을 먼저 따르세요","पहले उत्पाद पैकेजिंग पर लिखी समाप्ति तिथि का पालन करें"],"PL1-57":["Store refrigerated (do not reuse items set up at the buffet counter for sashimi)","냉장 보관(뷔페 카운터에 진열한 사시미는 재사용하지 마세요)","फ्रिज में रखें (बुफे काउंटर पर रखे सशिमी को पुनः उपयोग न करें)"],"PL1-65":["1/2 of the time stated on the packaging","포장에 기재된 시간의 1/2","पैकेजिंग पर लिखे समय का 1/2"],"PL1-66":["Store in the cooler. Follow the expiry date on the product packaging first","쿨러에 보관하세요. 제품 포장에 기재된 유통기한을 먼저 따르세요","कूलर में रखें। पहले उत्पाद पैकेजिंग पर लिखी समाप्ति तिथि का पालन करें"],"PL1-67":["Store in the cooler. Follow the expiry date on the product packaging first","쿨러에 보관하세요. 제품 포장에 기재된 유통기한을 먼저 따르세요","कूलर में रखें। पहले उत्पाद पैकेजिंग पर लिखी समाप्ति तिथि का पालन करें"],"PL1-68":["Store in a sealed container","밀폐 용기에 보관하세요","सीलबंद डिब्बे में रखें"],"PL1-69":["- Shelf life and storage conditions after opening follow the manufacturer recommendation first","- 개봉 후 유통기한과 보관 조건은 제조사 권장사항을 먼저 따릅니다","- खोलने के बाद शेल्फ लाइफ और भंडारण शर्तों के लिए पहले निर्माता की सिफारिश का पालन करें"],"PL2-01":["Record the preparation time, date and expiry date fully on the storage container and checklist.","조리 시간, 날짜, 유통기한을 보관 용기와 체크리스트에 빠짐없이 기록하세요.","तैयारी का समय, तिथि और समाप्ति तिथि भंडारण बर्तन और चेकलिस्ट पर पूरी तरह लिखें।"],"PL2-02":["Leftover after the shift (small quantity) should go into a storage container and into the fridge. Record the preparation date and expiry date fully on the storage container and checklist.","교대 후 남은 것(소량)은 보관 용기에 담아 냉장고에 넣으세요. 조리 날짜와 유통기한을 보관 용기와 체크리스트에 빠짐없이 기록하세요.","शिफ्ट के बाद बचा हुआ (कम मात्रा) भंडारण बर्तन में डालकर फ्रिज में रखें। तैयारी तिथि और समाप्ति तिथि भंडारण बर्तन और चेकलिस्ट पर पूरी तरह लिखें।"],"PL2-03":["Do not leave bruised; check daily. Record information fully in the checklist. Do not freeze fruit after thawing","멍들게 두지 말고 매일 확인하세요. 체크리스트에 정보를 빠짐없이 기록하세요. 해동 후 과일을 냉동하지 마세요","चोटिल न छोड़ें; रोज़ जाँचें। जानकारी चेकलिस्ट में पूरी लिखें। पिघलने के बाद फल को फिर से न जमाएँ"],"PL2-04":["Frozen fruit is for smoothies","냉동 과일은 스무디용입니다","जमे फल स्मूदी के लिए हैं"],"PL2-05":["After opening, keep in the original box in the cooler. Record the opening date and expiry date fully on the storage container and checklist.","개봉 후 원래 상자 그대로 쿨러에 보관하세요. 개봉 날짜와 유통기한을 보관 용기와 체크리스트에 빠짐없이 기록하세요.","खोलने के बाद मूल डिब्बे में ही कूलर में रखें। खोलने की तिथि और समाप्ति तिथि भंडारण बर्तन और चेकलिस्ट पर पूरी तरह लिखें।"],"PL2-06":["Store the original bottle at room temperature. Record the opening date and expiry date fully on the storage container and checklist.","원래 병 그대로 상온에 보관하세요. 개봉 날짜와 유통기한을 보관 용기와 체크리스트에 빠짐없이 기록하세요.","मूल बोतल को कमरे के तापमान पर रखें। खोलने की तिथि और समाप्ति तिथि भंडारण बर्तन और चेकलिस्ट पर पूरी तरह लिखें।"],"PL2-07":["Sugar is cooked into syrup for storage. Put it in a storage container. Store in the cooler. Record the preparation date and expiry date fully on the storage container and checklist. For outlets that use condensed milk frequ
